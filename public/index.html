<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        'mac-dark': '#1e1e1e',
                        'mac-darker': '#151515',
                        'mac-surface': '#2d2d2d',
                        'mac-border': '#3d3d3d',
                        'mac-accent': '#007aff',
                        'mac-accent-hover': '#0056b3',
                    },
                    boxShadow: {
                        'mac': '0 8px 32px rgba(0, 0, 0, 0.4)',
                        'mac-sm': '0 2px 8px rgba(0, 0, 0, 0.3)',
                        'glass': '0 8px 32px rgba(0, 0, 0, 0.3)',
                    },
                    backdropBlur: {
                        'mac': '20px',
                    },
                },
            },
        }
    </script>
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #0f0f0f 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .glass {
            background: rgba(45, 45, 45, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(45, 45, 45, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            background: rgba(55, 55, 55, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        .sidebar-item.active {
            background: rgba(0, 122, 255, 0.2);
            color: #0a84ff;
        }
        
        .btn-mac {
            background: linear-gradient(180deg, #3d3d3d 0%, #2d2d2d 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        
        .btn-mac:hover {
            background: linear-gradient(180deg, #4d4d4d 0%, #3d3d3d 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-mac-primary {
            background: linear-gradient(180deg, #007aff 0%, #0056b3 100%);
            border: 1px solid rgba(0, 122, 255, 0.5);
            transition: all 0.2s ease;
        }
        
        .btn-mac-primary:hover {
            background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%);
            border: 1px solid rgba(0, 122, 255, 0.7);
        }
        
        .input-mac {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        
        .input-mac:focus {
            border-color: rgba(0, 122, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
            outline: none;
        }
        
        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }
        
        .toast {
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
        }
        
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
        
        .link-card {
            border-radius: 16px;
        }
        
        .category-tag {
            background: rgba(0, 122, 255, 0.15);
            color: #0a84ff;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-gray-100">
    <div id="app" class="min-h-screen">
        <!-- Login View -->
        <div id="login-view" class="hidden min-h-screen flex items-center justify-center p-4">
            <div class="glass-card rounded-2xl p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-semibold">LinkHub</h1>
                    <p class="text-gray-400 mt-2">Sign in to your account</p>
                </div>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Username</label>
                        <input type="text" name="username" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Enter username">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Password</label>
                        <input type="password" name="password" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Enter password">
                    </div>
                    <button type="submit"
                        class="btn-mac-primary w-full py-3 rounded-xl text-white font-medium mt-6">
                        Sign In
                    </button>
                </form>
                <div class="text-center mt-6">
                    <p class="text-gray-400">
                        Don't have an account?
                        <a href="#" onclick="showView('register'); return false;" class="text-blue-400 hover:text-blue-300">Sign up</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Register View -->
        <div id="register-view" class="hidden min-h-screen flex items-center justify-center p-4">
            <div class="glass-card rounded-2xl p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-semibold">LinkHub</h1>
                    <p class="text-gray-400 mt-2">Create your account</p>
                </div>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Username</label>
                        <input type="text" name="username" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Choose username">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Password</label>
                        <input type="password" name="password" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Choose password">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Confirm Password</label>
                        <input type="password" name="confirm_password" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Confirm password">
                    </div>
                    <button type="submit"
                        class="btn-mac-primary w-full py-3 rounded-xl text-white font-medium mt-6">
                        Create Account
                    </button>
                </form>
                <div class="text-center mt-6">
                    <p class="text-gray-400">
                        Already have an account?
                        <a href="#" onclick="showView('login'); return false;" class="text-blue-400 hover:text-blue-300">Sign in</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden min-h-screen flex">
            <!-- Sidebar -->
            <aside class="w-64 glass h-screen fixed left-0 top-0 flex flex-col">
                <div class="p-4 border-b border-gray-800">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                            </svg>
                        </div>
                        <span class="font-semibold text-lg">LinkHub</span>
                    </div>
                </div>
                
                <nav class="flex-1 p-3 space-y-1">
                    <a href="#" onclick="filterCategory('all'); return false;" class="sidebar-item active flex items-center gap-3 px-3 py-2.5 text-sm" data-category="all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                        </svg>
                        All Links
                    </a>
                    <div id="category-list" class="space-y-1">
                        <!-- Dynamic categories -->
                    </div>
                </nav>
                
                <div class="p-3 border-t border-gray-800">
                    <div class="sidebar-item flex items-center gap-3 px-3 py-2.5 text-sm text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span id="username-display">User</span>
                    </div>
                    <button onclick="logout()" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 text-sm text-red-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Sign Out
                    </button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 ml-64 p-6">
                <div class="max-w-6xl mx-auto">
                    <!-- Header -->
                    <div class="flex items-center justify-between mb-8">
                        <div>
                            <h1 class="text-2xl font-semibold">My Links</h1>
                            <p class="text-gray-400 mt-1">Manage your bookmarks</p>
                        </div>
                        <button onclick="openModal()" class="btn-mac-primary px-5 py-2.5 rounded-xl text-white font-medium flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            Add Link
                        </button>
                    </div>

                    <!-- Search & Filter -->
                    <div class="glass rounded-xl p-4 mb-6 flex items-center gap-4">
                        <div class="flex-1 relative">
                            <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <input type="text" id="search-input" 
                                oninput="searchLinks(this.value)"
                                class="input-mac w-full pl-10 pr-4 py-2.5 rounded-xl text-gray-100 placeholder-gray-500"
                                placeholder="Search links...">
                        </div>
                    </div>

                    <!-- Links Grid -->
                    <div id="links-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Dynamic link cards -->
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden text-center py-16">
                        <div class="w-20 h-20 mx-auto mb-4 bg-gray-800 rounded-2xl flex items-center justify-center">
                            <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-medium mb-2">No links yet</h3>
                        <p class="text-gray-400 mb-6">Add your first bookmark to get started</p>
                        <button onclick="openModal()" class="btn-mac px-6 py-2.5 rounded-xl text-white font-medium">
                            Add Your First Link
                        </button>
                    </div>
                </div>
            </main>
        </div>

        <!-- Add/Edit Modal -->
        <div id="link-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
            <div class="glass-card relative rounded-2xl p-6 w-full max-w-md">
                <h2 id="modal-title" class="text-xl font-semibold mb-6">Add New Link</h2>
                <form id="link-form" class="space-y-4">
                    <input type="hidden" name="link_id" value="">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Title</label>
                        <input type="text" name="title" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="Link title">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">URL</label>
                        <input type="url" name="url" required
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="https://example.com">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Category (optional)</label>
                        <input type="text" name="category" list="categories"
                            class="input-mac w-full px-4 py-3 rounded-xl text-gray-100 placeholder-gray-500"
                            placeholder="e.g. Work, Personal, Tools">
                        <datalist id="categories"></datalist>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button type="button" onclick="closeModal()"
                            class="btn-mac flex-1 py-3 rounded-xl text-white font-medium">
                            Cancel
                        </button>
                        <button type="submit"
                            class="btn-mac-primary flex-1 py-3 rounded-xl text-white font-medium">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-3"></div>
    </div>

    <script>
        let currentUser = null;
        let links = [];
        let categories = [];
        let activeCategory = 'all';
        let isEditing = false;

        // Check auth on load
        async function checkAuth() {
            try {
                const res = await fetch('/api/user');
                const data = await res.json();
                if (data.success) {
                    currentUser = data;
                    showView('dashboard');
                    loadLinks();
                } else {
                    showView('login');
                }
            } catch {
                showView('login');
            }
        }

        // Get CSRF token
        function getCsrfToken() {
            return document.querySelector('input[name="csrf_token"]')?.value || '';
        }

        // Show view
        function showView(view) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('register-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            
            if (view === 'login') {
                document.getElementById('login-view').classList.remove('hidden');
            } else if (view === 'register') {
                document.getElementById('register-view').classList.remove('hidden');
            } else if (view === 'dashboard') {
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('username-display').textContent = currentUser?.username || 'User';
            }
        }

        // Show toast
        function showToast(message, type = 'success') {
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-blue-600'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type]} px-5 py-3 rounded-xl text-white font-medium`;
            toast.textContent = message;
            
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // Login
        document.getElementById('login-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: formData.get('username'),
                    password: formData.get('password'),
                    csrf_token: await getCsrfToken()
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                currentUser = { user_id: data.user_id, username: data.username };
                showView('dashboard');
                loadLinks();
                e.target.reset();
            } else {
                showToast(data.message, 'error');
            }
        });

        // Register
        document.getElementById('register-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            if (formData.get('password') !== formData.get('confirm_password')) {
                showToast('Passwords do not match', 'error');
                return;
            }
            
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: formData.get('username'),
                    password: formData.get('password'),
                    confirm_password: formData.get('confirm_password'),
                    csrf_token: await getCsrfToken()
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                currentUser = { username: formData.get('username') };
                showView('dashboard');
                loadLinks();
                e.target.reset();
            } else {
                showToast(data.message, 'error');
            }
        });

        // Logout
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            currentUser = null;
            links = [];
            showView('login');
        }

        // Load links
        async function loadLinks(search = '', category = '') {
            const params = new URLSearchParams();
            if (search) params.set('search', search);
            if (category && category !== 'all') params.set('category', category);
            
            const res = await fetch(`/api/links?${params}`);
            const data = await res.json();
            
            if (data.success) {
                links = data.links || [];
                renderLinks();
                updateCategories();
            }
        }

        // Render links
        function renderLinks() {
            const grid = document.getElementById('links-grid');
            const empty = document.getElementById('empty-state');
            
            let filtered = links;
            if (activeCategory !== 'all') {
                filtered = links.filter(l => l.category === activeCategory);
            }
            
            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
            
            grid.innerHTML = filtered.map(link => `
                <div class="glass-card link-card p-5">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="font-medium truncate flex-1 pr-2">${escapeHtml(link.title)}</h3>
                        <div class="flex gap-1">
                            <button onclick="editLink(${link.id})" class="p-1.5 rounded-lg hover:bg-white/10 text-gray-400 hover:text-white">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            <button onclick="deleteLink(${link.id})" class="p-1.5 rounded-lg hover:bg-red-500/20 text-gray-400 hover:text-red-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <a href="${escapeHtml(link.url)}" target="_blank" class="block text-sm text-gray-400 truncate mb-3 hover:text-blue-400">
                        ${escapeHtml(link.url)}
                    </a>
                    <div class="flex items-center justify-between">
                        ${link.category ? `<span class="category-tag">${escapeHtml(link.category)}</span>` : '<span></span>'}
                        <span class="text-xs text-gray-500">${formatDate(link.created_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Update categories in sidebar
        function updateCategories() {
            const categoryList = document.getElementById('category-list');
            const uniqueCategories = [...new Set(links.map(l => l.category).filter(Boolean))];
            
            categoryList.innerHTML = uniqueCategories.map(cat => `
                <a href="#" onclick="filterCategory('${escapeHtml(cat)}'); return false;" 
                   class="sidebar-item flex items-center gap-3 px-3 py-2.5 text-sm" data-category="${escapeHtml(cat)}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                    ${escapeHtml(cat)}
                </a>
            `).join('');
            
            // Update datalist
            const datalist = document.getElementById('categories');
            datalist.innerHTML = uniqueCategories.map(cat => `<option value="${escapeHtml(cat)}">`).join('');
        }

        // Filter by category
        function filterCategory(category) {
            activeCategory = category;
            
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.category === category) {
                    item.classList.add('active');
                }
            });
            
            renderLinks();
        }

        // Search links
        function searchLinks(query) {
            loadLinks(query, activeCategory);
        }

        // Open modal
        function openModal(linkId = null) {
            const modal = document.getElementById('link-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('link-form');
            
            if (linkId) {
                const link = links.find(l => l.id === linkId);
                if (link) {
                    title.textContent = 'Edit Link';
                    form.link_id.value = link.id;
                    form.title.value = link.title;
                    form.url.value = link.url;
                    form.category.value = link.category || '';
                    isEditing = true;
                }
            } else {
                title.textContent = 'Add New Link';
                form.reset();
                form.link_id.value = '';
                isEditing = false;
            }
            
            modal.classList.remove('hidden');
        }

        // Close modal
        function closeModal() {
            document.getElementById('link-modal').classList.add('hidden');
        }

        // Edit link
        function editLink(id) {
            openModal(id);
        }

        // Delete link
        async function deleteLink(id) {
            if (!confirm('Are you sure you want to delete this link?')) return;
            
            const res = await fetch('/api/links', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, csrf_token: await getCsrfToken() })
            });
            
            const data = await res.json();
            
            if (data.success) {
                showToast('Link deleted', 'success');
                loadLinks();
            } else {
                showToast(data.message, 'error');
            }
        }

        // Save link
        document.getElementById('link-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const linkId = formData.get('link_id');
            
            const payload = {
                title: formData.get('title'),
                url: formData.get('url'),
                category: formData.get('category') || null,
                csrf_token: await getCsrfToken()
            };
            
            let res;
            if (linkId) {
                payload.id = parseInt(linkId);
                res = await fetch('/api/links', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch('/api/links', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            
            const data = await res.json();
            
            if (data.success) {
                showToast(linkId ? 'Link updated' : 'Link added', 'success');
                closeModal();
                loadLinks();
            } else {
                showToast(data.message, 'error');
            }
        });

        // Utility functions
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
